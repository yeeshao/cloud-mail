name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

# 1. 补全 Cloudflare 控制台最新的 Observability (日志与追踪) 配置，消除“配置不一致”警告
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# 数据库与存储绑定（取消注释并填入你在 Cloudflare 创建的真实 ID 即可使用）
#[[d1_databases]]
#binding = "db"
#database_name = "cloud-mail-db"
#database_id = "这里填你的D1数据库ID"

#[[kv_namespaces]]
#binding = "kv"
#id = "这里填你的KV空间ID"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "cloud-mail-r2"

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

# 2. 注释掉 Cron 触发器，彻底避免“Number of triggers created exceeds limit”超限报错
#[triggers]
#crons = ["0 * * * *"]

# 3. 环境变量（建议在 Cloudflare 网页后台 Settings -> Variables 配置，或取消注释在此填写）
[vars]
#ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
#analysis_cache = false
#orm_log = false
#domain = ["example.com"]
#admin = "admin@example.com"
#jwt_secret = "your-random-jwt-secret-string"

# 4. 注释掉跨目录构建指令（因为前端 dist 已经在本地手动打包并放入了根目录）
#[build]
#command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
